    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap');

        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

        :root {
            --gold: #b8a044;
            --gold-light: #d4c477;
            --bg: #0c0c0e;
            --bg-subtle: #141418;
            --text: #e8e6e1;
            --text-muted: #8a877f;
            --serif: 'Cormorant Garamond', Georgia, serif;
            --sans: 'DM Sans', -apple-system, sans-serif;
        }

        html { font-size: 16px; }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        /* Subtle ambient grain */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* Subtle radial glow */
        body::after {
            content: '';
            position: fixed;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(184,160,68,0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 560px;
            animation: fadeUp 1.2s ease-out both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 88px;
            height: 88px;
            margin: 0 auto 2.5rem;
            opacity: 0;
            animation: fadeUp 1s ease-out 0.2s both;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(184,160,68,0.15));
        }

        h1 {
            font-family: var(--serif);
            font-weight: 400;
            font-size: 2.25rem;
            letter-spacing: 0.04em;
            color: var(--text);
            margin-bottom: 0.35rem;
            line-height: 1.2;
            opacity: 0;
            animation: fadeUp 1s ease-out 0.35s both;
        }

        .suffix {
            font-family: var(--sans);
            font-weight: 300;
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 2.2rem;
            opacity: 0;
            animation: fadeUp 1s ease-out 0.45s both;
        }

        .divider {
            width: 48px;
            height: 1px;
            background: var(--gold);
            margin: 0 auto 2rem;
            opacity: 0;
            animation: fadeUp 1s ease-out 0.55s both;
        }

        .tagline {
            font-family: var(--serif);
            font-weight: 300;
            font-style: italic;
            font-size: 1.15rem;
            line-height: 1.7;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeUp 1s ease-out 0.65s both;
        }

        .focus-areas {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeUp 1s ease-out 0.8s both;
        }

        .focus-areas span {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold);
            position: relative;
        }

        .focus-areas span:not(:last-child)::after {
            content: '·';
            position: absolute;
            right: -0.9rem;
            color: var(--text-muted);
        }

        .contact-block {
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeUp 1s ease-out 0.95s both;
        }

        .contact-block a {
            color: var(--text);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            border-bottom: 1px solid rgba(232,230,225,0.15);
            padding-bottom: 2px;
            transition: border-color 0.3s ease, color 0.3s ease;
        }

        .contact-block a:hover {
            color: var(--gold-light);
            border-color: var(--gold);
        }

        .linkedin {
            opacity: 0;
            animation: fadeUp 1s ease-out 1.1s both;
        }

        .linkedin a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .linkedin a:hover {
            color: var(--gold-light);
        }

        .linkedin svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .relaunch-note {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            opacity: 0;
            animation: fadeUp 1s ease-out 1.4s both;
            z-index: 1;
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.75rem; }
            .tagline { font-size: 1rem; }
            .focus-areas { gap: 1rem; }
            .focus-areas span { font-size: 0.65rem; }
            .relaunch-note { font-size: 0.6rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="logo.png" alt="ECL — Eirini C. Lika">
        </div>

        <h1>Eirini C. Lika</h1>
        <div class="suffix">Solicitor, LL.M</div>

        <div class="divider"></div>

        <p class="tagline">
            Internationale Boutique-Kanzlei für grenzüberschreitende<br>
            Mandate im EU-Recht, KI-Regulierung und Datenschutz
        </p>

        <div class="focus-areas">
            <span>EU Regulatory</span>
            <span>AI Governance</span>
            <span>Cross-Border</span>
        </div>

        <div class="contact-block">
            <a href="mailto:office@eiriniclika.com">office@eiriniclika.com</a>
        </div>

        <div class="linkedin">
            <a href="https://www.linkedin.com/in/eirini-lika/" target="_blank" rel="noopener">

        </div>
